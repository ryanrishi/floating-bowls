<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floating Bowls</title>
    <meta
      name="description"
      content="Porcelain bowls drift on a slow current in a round basin, strike each other at random, and ring. Nothing is composed — the music is a by-product of the physics."
    />

    <!--
      Link previews need absolute URLs, so these cannot use the relative base the rest of
      the build does. If the site moves, these three are what have to change.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Floating Bowls" />
    <meta
      property="og:description"
      content="Porcelain bowls drift on a slow current in a round basin, strike each other at random, and ring. Nothing is composed — the music is a by-product of the physics."
    />
    <meta property="og:url" content="https://ryanrishi.github.io/floating-bowls/" />
    <meta property="og:image" content="https://ryanrishi.github.io/floating-bowls/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Hundreds of small white porcelain bowls floating on a circular pool of bright blue water."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b6fa8'/%3E%3Cellipse cx='16' cy='17' rx='9' ry='7' fill='%23f6f3ec'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/ui/panel.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="start" class="overlay">
      <div class="overlay-card">
        <h1>Floating Bowls</h1>
        <p>
          Porcelain bowls drift on a slow current in a round basin. They strike each other
          at random and ring. Nothing here is composed &mdash; the music is a by-product of
          the physics.
        </p>
        <p class="credit">
          After <em>Clinamen</em> by C&eacute;leste Boursier-Mougenot.
        </p>
        <button id="start-button" type="button">Begin</button>
        <p class="hint">Sound on. Click the water to push it.</p>
      </div>
    </div>

    <aside id="panel" hidden>
      <button id="panel-toggle" type="button" aria-expanded="true">&minus;</button>
      <div id="panel-body">
        <label>
          <span>Bowls<output data-for="count"></output></span>
          <input id="count" type="range" min="10" max="320" step="10" />
        </label>
        <label>
          <span>Current<output data-for="current"></output></span>
          <input id="current" type="range" min="0" max="2.5" step="0.05" />
        </label>
        <label>
          <span>Size spread<output data-for="spread"></output></span>
          <input id="spread" type="range" min="0" max="0.7" step="0.01" />
        </label>
        <label>
          <span>Reverb<output data-for="reverb"></output></span>
          <input id="reverb" type="range" min="0" max="1" step="0.01" />
        </label>
        <label>
          <span>Volume<output data-for="volume"></output></span>
          <input id="volume" type="range" min="0" max="1" step="0.01" />
        </label>
      </div>
    </aside>

    <canvas id="debug" hidden></canvas>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
